name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate icons (PNG not committed)
        run: node tools/gen-icons.mjs

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/paper-journal.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-journal-apk
          path: out/paper-journal.apk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '最新构建' }}
          body: |
            纸间 · Paper Journal

            - 自动构建于 ${{ github.sha }}
            - 安装包已使用 debug 证书签名，可直接侧载安装
          files: out/paper-journal.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
